# ==============================================================================
# SENTINEL GUJARAT — Docker Compose
# Requires a .env file in this directory (copy from .env.example).
# Start everything:  docker compose up -d
# Or use the one-click launcher: sentinel.bat
# ==============================================================================

services:

  # ----------------------------------------------------------------------------
  # PostgreSQL 16 + PostGIS 3.4
  # ----------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: sentinel_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentinel_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Redis 7
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sentinel_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # FastAPI Backend  (port 8000)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_backend
    ports:
      - "8000:8000"
    # Load the shared .env, then override Docker-internal service addresses.
    env_file: .env
    environment:
      # Always point to compose service names inside Docker networking.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/sentinel_db
      REDIS_URL: redis://redis:6379/0
      # Sandbox
      SANDBOX_HOST: ${SANDBOX_HOST:-cctv.corp8.cloud}
      SANDBOX_INGEST_URL: ${SANDBOX_INGEST_URL:-https://cctv.corp8.cloud/cameras.json}
      SANDBOX_HLS_BASE: ${SANDBOX_HLS_BASE:-https://cctv.corp8.cloud}
      SANDBOX_WHEP_BASE: ${SANDBOX_WHEP_BASE:-http://103.250.160.189:8889/stream}
      SANDBOX_RTSP_HOST: ${SANDBOX_RTSP_HOST:-103.250.160.189:8554}
      SANDBOX_EMAIL: ${SANDBOX_EMAIL:-}
      SANDBOX_PASSWORD: ${SANDBOX_PASSWORD:-}
      CATALOG_AUTO_SYNC: ${CATALOG_AUTO_SYNC:-false}
      CATALOG_REFRESH_SECONDS: ${CATALOG_REFRESH_SECONDS:-3600}
      SECRET_KEY: ${SECRET_KEY:-sentinel-gujarat-dev-secret-change-in-prod}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-sentinel-worker-internal-key}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      STREAM_IDLE_SECONDS: ${STREAM_IDLE_SECONDS:-120}
      OPENCV_FFMPEG_CAPTURE_OPTIONS: ${OPENCV_FFMPEG_CAPTURE_OPTIONS:-rtsp_transport;tcp}
    # Allow containers to reach the host machine (e.g. sandbox on host network).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # OpenCV Capture Worker
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: sentinel_worker
    env_file: .env
    environment:
      # Docker-internal service addresses.
      REDIS_URL: redis://redis:6379/0
      BACKEND_URL: http://backend:8000
      # Sandbox
      SANDBOX_HOST: ${SANDBOX_HOST:-cctv.corp8.cloud}
      SANDBOX_INGEST_URL: ${SANDBOX_INGEST_URL:-https://cctv.corp8.cloud/cameras.json}
      SANDBOX_HLS_BASE: ${SANDBOX_HLS_BASE:-https://cctv.corp8.cloud}
      SANDBOX_WHEP_BASE: ${SANDBOX_WHEP_BASE:-http://103.250.160.189:8889/stream}
      SANDBOX_RTSP_HOST: ${SANDBOX_RTSP_HOST:-103.250.160.189:8554}
      SANDBOX_EMAIL: ${SANDBOX_EMAIL:-}
      SANDBOX_PASSWORD: ${SANDBOX_PASSWORD:-}
      CATALOG_REFRESH_SECONDS: ${CATALOG_REFRESH_SECONDS:-60}
      ACTIVE_POLL_SECONDS: ${ACTIVE_POLL_SECONDS:-5}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-sentinel-worker-internal-key}
      OPENCV_FFMPEG_CAPTURE_OPTIONS: ${OPENCV_FFMPEG_CAPTURE_OPTIONS:-rtsp_transport;tcp}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # React + Vite Frontend  (port 5173)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel_frontend
    ports:
      - "5173:5173"
    env_file: .env
    environment:
      # Browser-facing URL — must be reachable from the user's machine.
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
      VITE_SANDBOX_HOST: ${SANDBOX_HOST}
    depends_on:
      - backend
    restart: unless-stopped

# ------------------------------------------------------------------------------
# Named Volumes
# ------------------------------------------------------------------------------
volumes:
  pgdata:
    name: sentinel_pgdata
