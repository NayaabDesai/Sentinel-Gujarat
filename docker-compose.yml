services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel_gujarat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_gujarat"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@db:5432/sentinel_gujarat
      REDIS_URL: redis://redis:6379/0
      SANDBOX_HOST: ${SANDBOX_HOST:-cctv.corp8.cloud}
      SANDBOX_INGEST_URL: ${SANDBOX_INGEST_URL:-https://cctv.corp8.cloud/cameras.json}
      SANDBOX_HLS_BASE: ${SANDBOX_HLS_BASE:-https://cctv.corp8.cloud}
      SANDBOX_MEDIA_IP: ${SANDBOX_MEDIA_IP:-103.250.160.189}
      SANDBOX_WHEP_BASE: ${SANDBOX_WHEP_BASE:-http://103.250.160.189:8889/stream}
      SANDBOX_RTSP_BASE: ${SANDBOX_RTSP_BASE:-rtsp://103.250.160.189:8554/stream}
      SANDBOX_EMAIL: ${SANDBOX_EMAIL}
      SANDBOX_PASSWORD: ${SANDBOX_PASSWORD}
      CATALOG_REFRESH_SECONDS: ${CATALOG_REFRESH_SECONDS:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      OPENCV_FFMPEG_CAPTURE_OPTIONS: rtsp_transport;tcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./worker
    env_file:
      - .env
    environment:
      SANDBOX_HOST: ${SANDBOX_HOST:-cctv.corp8.cloud}
      SANDBOX_INGEST_URL: ${SANDBOX_INGEST_URL:-https://cctv.corp8.cloud/cameras.json}
      SANDBOX_MEDIA_IP: ${SANDBOX_MEDIA_IP:-103.250.160.189}
      SANDBOX_RTSP_BASE: ${SANDBOX_RTSP_BASE:-rtsp://103.250.160.189:8554/stream}
      SANDBOX_EMAIL: ${SANDBOX_EMAIL}
      SANDBOX_PASSWORD: ${SANDBOX_PASSWORD}
      BACKEND_URL: http://backend:8000
      REDIS_URL: redis://redis:6379/0
      OPENCV_FFMPEG_CAPTURE_OPTIONS: rtsp_transport;tcp
      CATALOG_REFRESH_SECONDS: ${CATALOG_REFRESH_SECONDS:-60}
      ACTIVE_POLL_SECONDS: "5"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000
      VITE_SANDBOX_HOST: ${SANDBOX_HOST:-cctv.corp8.cloud}
    depends_on:
      - backend

volumes:
  pgdata:
